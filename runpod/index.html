<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Create a Runpod Pod from the bridge API.">
    <title>Runpod Bridge · Create Pod</title>
    <style>
        /* ---------- design tokens ---------- */
        :root {
            --bg: #08090d;
            --surface: rgba(255, 255, 255, .035);
            --surface-2: rgba(255, 255, 255, .06);
            --border: rgba(255, 255, 255, .08);
            --border-strong: rgba(255, 255, 255, .16);
            --text: #e9ecf5;
            --muted: #8f96ad;
            --muted-2: #6b7288;
            --accent: #7c6cff;
            --accent-2: #22d3ee;
            --ok: #34d399;
            --warn: #fbbf24;
            --err: #fb7185;
            --radius: 18px;
            --radius-sm: 11px;
            --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* ---------- base ---------- */
        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--sans);
            color: var(--text);
            background: var(--bg);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(900px 520px at 10% -12%, rgba(124, 108, 255, .26), transparent 62%),
                radial-gradient(760px 480px at 94% 4%, rgba(34, 211, 238, .16), transparent 60%),
                radial-gradient(900px 620px at 52% 118%, rgba(236, 72, 153, .12), transparent 62%),
                var(--bg);
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: .35;
            background-image:
                linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(circle at 50% 0%, #000, transparent 78%);
            -webkit-mask-image: radial-gradient(circle at 50% 0%, #000, transparent 78%);
        }

        /* ---------- shell ---------- */
        .shell {
            max-width: 1240px;
            margin: 0 auto;
            padding: 34px 24px 56px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 26px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border-radius: 13px;
            background: linear-gradient(140deg, var(--accent), var(--accent-2));
            box-shadow: 0 10px 30px -10px rgba(124, 108, 255, .9);
        }

        .logo svg { width: 24px; height: 24px; display: block; }

        .brand h1 {
            margin: 0;
            font-size: 1.16rem;
            font-weight: 650;
            letter-spacing: -.02em;
        }

        .brand p {
            margin: 2px 0 0;
            font-size: .82rem;
            color: var(--muted);
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 8px 14px 8px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            font-size: .82rem;
            font-weight: 550;
            letter-spacing: .01em;
            color: var(--muted);
            transition: color .25s ease, border-color .25s ease, background .25s ease;
        }

        .status-chip .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted-2);
            flex: none;
        }

        .status-chip[data-state="checking"] { color: var(--warn); border-color: rgba(251, 191, 36, .3); }
        .status-chip[data-state="checking"] .dot { background: var(--warn); animation: pulse 1.1s ease-in-out infinite; }
        .status-chip[data-state="online"] { color: var(--ok); border-color: rgba(52, 211, 153, .3); background: rgba(52, 211, 153, .07); }
        .status-chip[data-state="online"] .dot { background: var(--ok); box-shadow: 0 0 0 4px rgba(52, 211, 153, .15); }
        .status-chip[data-state="degraded"] { color: var(--warn); border-color: rgba(251, 191, 36, .3); background: rgba(251, 191, 36, .07); }
        .status-chip[data-state="degraded"] .dot { background: var(--warn); }
        .status-chip[data-state="offline"] { color: var(--err); border-color: rgba(251, 113, 133, .32); background: rgba(251, 113, 133, .08); }
        .status-chip[data-state="offline"] .dot { background: var(--err); box-shadow: 0 0 0 4px rgba(251, 113, 133, .14); }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .35; transform: scale(.75); }
        }

        /* ---------- layout ---------- */
        .layout {
            display: grid;
            grid-template-columns: minmax(0, 380px) minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        .col {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }

        @media (max-width: 960px) {
            .layout { grid-template-columns: minmax(0, 1fr); }
        }

        /* ---------- card ---------- */
        .card {
            position: relative;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .02));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .06),
                0 24px 60px -28px rgba(0, 0, 0, .9);
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            overflow: hidden;
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 20px 0;
        }

        .card h2 {
            margin: 0;
            font-size: .74rem;
            font-weight: 650;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .card-body { padding: 16px 20px 20px; }

        .lede {
            margin: 8px 0 0;
            font-size: .86rem;
            color: var(--muted);
        }

        /* ---------- form ---------- */
        .field { margin-top: 18px; }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: .78rem;
            font-weight: 550;
            color: var(--muted);
        }

        .endpoint-row {
            display: flex;
            gap: 9px;
        }

        input[type="url"], input[type="text"] {
            flex: 1 1 auto;
            min-width: 0;
            padding: 11px 13px;
            font-family: var(--mono);
            font-size: .82rem;
            color: var(--text);
            background: rgba(0, 0, 0, .34);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }

        input[type="url"]:focus, input[type="text"]:focus {
            border-color: rgba(124, 108, 255, .7);
            box-shadow: 0 0 0 3px rgba(124, 108, 255, .18);
            background: rgba(0, 0, 0, .46);
        }

        .hint {
            margin: 9px 0 0;
            font-size: .76rem;
            color: var(--muted-2);
            min-height: 1.2em;
        }

        .hint b { color: var(--muted); font-weight: 550; }

        .suggest {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 6px 11px;
            font: inherit;
            font-size: .76rem;
            color: var(--accent-2);
            background: rgba(34, 211, 238, .08);
            border: 1px solid rgba(34, 211, 238, .25);
            border-radius: 999px;
            cursor: pointer;
            transition: background .2s ease, transform .15s ease;
        }

        .suggest:hover { background: rgba(34, 211, 238, .16); transform: translateY(-1px); }
        .suggest[hidden] { display: none; }

        /* ---------- buttons ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 17px;
            font-family: inherit;
            font-size: .84rem;
            font-weight: 600;
            color: var(--text);
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            white-space: nowrap;
            transition: background .2s ease, border-color .2s ease, transform .15s ease, opacity .2s ease;
        }

        .btn:hover:not(:disabled) { background: rgba(255, 255, 255, .1); border-color: var(--border-strong); }
        .btn:active:not(:disabled) { transform: translateY(1px); }
        .btn:disabled { opacity: .55; cursor: not-allowed; }
        .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(124, 108, 255, .35); }
        .btn[hidden] { display: none; }

        .btn--primary {
            color: #0b0b12;
            background: linear-gradient(135deg, var(--accent) 0%, #9a6bff 55%, var(--accent-2) 130%);
            border-color: transparent;
            box-shadow: 0 10px 26px -12px rgba(124, 108, 255, .95);
        }

        .btn--primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #8b7cff 0%, #a97bff 55%, #3fdcf3 130%);
            border-color: transparent;
        }

        .btn--ghost { background: transparent; }
        .btn--sm { padding: 7px 12px; font-size: .78rem; }

        .spinner {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(11, 11, 18, .3);
            border-top-color: #0b0b12;
            animation: spin .7s linear infinite;
            display: none;
        }

        .is-busy .spinner { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- metrics ---------- */
        .metrics {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
            margin-top: 20px;
        }

        .metric {
            padding: 11px 13px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, .24);
        }

        .metric-label {
            display: block;
            font-size: .68rem;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted-2);
        }

        .metric-value {
            display: block;
            margin-top: 4px;
            font-family: var(--mono);
            font-size: .92rem;
            font-weight: 600;
            color: var(--text);
            overflow-wrap: anywhere;
        }

        .metric-value.is-ok { color: var(--ok); }
        .metric-value.is-warn { color: var(--warn); }
        .metric-value.is-err { color: var(--err); }

        /* ---------- response ---------- */
        .response-tools { display: flex; gap: 8px; }

        .routes {
            display: none;
            margin-top: 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: rgba(0, 0, 0, .22);
            overflow: hidden;
        }

        .routes.is-visible { display: block; }

        .routes-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 11px 14px;
            border-bottom: 1px solid var(--border);
            font-size: .78rem;
            color: var(--muted);
        }

        .routes-head strong { color: var(--text); font-weight: 600; }

        .route-list { list-style: none; margin: 0; padding: 6px; max-height: 230px; overflow: auto; }

        .route {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 8px;
            border-radius: 8px;
            font-family: var(--mono);
            font-size: .78rem;
        }

        .route:hover { background: rgba(255, 255, 255, .04); }

        .method {
            flex: none;
            min-width: 58px;
            padding: 2px 7px;
            border-radius: 5px;
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .04em;
            text-align: center;
            border: 1px solid transparent;
        }

        .method[data-m="GET"] { color: #7dd3fc; background: rgba(56, 189, 248, .12); border-color: rgba(56, 189, 248, .28); }
        .method[data-m="POST"] { color: #6ee7b7; background: rgba(52, 211, 153, .12); border-color: rgba(52, 211, 153, .28); }
        .method[data-m="DELETE"] { color: #fda4af; background: rgba(251, 113, 133, .12); border-color: rgba(251, 113, 133, .28); }
        .method[data-m="PUT"], .method[data-m="PATCH"] { color: #fcd34d; background: rgba(251, 191, 36, .12); border-color: rgba(251, 191, 36, .28); }

        .route-path { color: var(--muted); overflow-wrap: anywhere; }

        .output-wrap {
            margin-top: 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: rgba(0, 0, 0, .38);
            overflow: hidden;
        }

        pre.output {
            margin: 0;
            padding: 15px 16px;
            max-height: 58vh;
            min-height: 220px;
            overflow: auto;
            font-family: var(--mono);
            font-size: .8rem;
            line-height: 1.65;
            color: #cbd2e4;
            white-space: pre-wrap;
            word-break: break-word;
            tab-size: 2;
        }

        pre.output.is-empty {
            display: grid;
            place-items: center;
            text-align: center;
            color: var(--muted-2);
            font-family: var(--sans);
            font-size: .86rem;
        }

        pre.output code { font: inherit; }

        .tok-key { color: #93c5fd; }
        .tok-str { color: #86efac; }
        .tok-num { color: #fbbf24; }
        .tok-bool { color: #c4b5fd; }
        .tok-null { color: #fda4af; }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .12); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, .22); background-clip: content-box; }

        /* ---------- history ---------- */
        .history { list-style: none; margin: 12px 0 0; padding: 0; }

        .history li {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 10px 4px;
            border-top: 1px solid var(--border);
            font-size: .8rem;
        }

        .history li:first-child { border-top: 0; }

        .history .h-status {
            flex: none;
            min-width: 40px;
            font-family: var(--mono);
            font-size: .74rem;
            font-weight: 700;
        }

        .history .h-status.ok { color: var(--ok); }
        .history .h-status.warn { color: var(--warn); }
        .history .h-status.err { color: var(--err); }

        .history .h-url {
            flex: 1 1 auto;
            min-width: 0;
            font-family: var(--mono);
            font-size: .76rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history .h-time {
            flex: none;
            font-size: .72rem;
            color: var(--muted-2);
            font-variant-numeric: tabular-nums;
        }

        .empty-note {
            margin: 12px 0 0;
            font-size: .82rem;
            color: var(--muted-2);
        }

        footer {
            margin-top: 26px;
            text-align: center;
            font-size: .74rem;
            color: var(--muted-2);
        }

        footer code { font-family: var(--mono); color: var(--muted); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .001ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <div class="brand">
                <div class="logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#0b0b12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5Z"/>
                    </svg>
                </div>
                <div>
                    <h1>Runpod Bridge</h1>
                    <p>Control-plane console</p>
                </div>
            </div>
            <div class="status-chip" id="statusChip" data-state="idle" role="status" aria-live="polite">
                <span class="dot"></span>
                <span id="statusText">Idle</span>
            </div>
        </header>

        <div class="layout">
            <div class="col">
                <section class="card">
                    <div class="card-head"><h2>Create Pod</h2></div>
                    <div class="card-body">
                        <p class="lede">Creates a Pod from the configured template and GPU preferences.</p>

                        <div class="field">
                            <div class="endpoint-row">
                                <button class="btn btn--primary" id="createBtn" type="button">
                                    <span class="spinner" aria-hidden="true"></span>
                                    <span id="createLabel">Create Pod</span>
                                </button>
                                <a class="btn btn--ghost" id="openWebuiBtn" href="http://localhost:3000"
                                   target="_blank" rel="noopener" hidden>Open WebUI</a>
                            </div>
                        </div>

                        <div class="output-wrap" id="previewWrap" hidden>
                            <pre class="output" id="preview" aria-live="polite"></pre>
                        </div>
                    </div>
                </section>
            </div>
        </div>

        <footer>
            Runpod bridge console · served by <code>nginx</code> on port <code>8081</code>
        </footer>
    </main>

    <script>
        (function () {
            'use strict';

            var POD_NAME = 'my-first-pod';
            var CREATE_POD_URL = '/api/runpod/pods';
            var POD_URL = '/api/runpod/pods/' + encodeURIComponent(POD_NAME);
            var TUNNEL_URL = '/api/runpod/create-ssh-tunnel';
            var OLLAMA_URL = '/ollama/api/tags';
            var POLL_INTERVAL_MS = 5000;
            var REQUEST_TIMEOUT_MS = 60000;
            var TUNNEL_MAX_ATTEMPTS = 60;
            var OPEN_WEBUI_PORT = 3000;

            var els = {
                createBtn: document.getElementById('createBtn'),
                createLabel: document.getElementById('createLabel'),
                openWebuiBtn: document.getElementById('openWebuiBtn'),
                statusChip: document.getElementById('statusChip'),
                statusText: document.getElementById('statusText'),
                previewWrap: document.getElementById('previewWrap'),
                preview: document.getElementById('preview')
            };

            var busy = false;
            var buttonMode = 'create';

            /* ---------- helpers ---------- */

            function setStatus(state, label) {
                els.statusChip.setAttribute('data-state', state);
                els.statusText.textContent = label;
            }

            function setButton(label, isBusy) {
                busy = isBusy;
                els.createBtn.disabled = isBusy;
                els.createBtn.classList.toggle('is-busy', isBusy);
                els.createLabel.textContent = label;
            }

            function openWebuiUrl() {
                return 'http://' + (window.location.hostname || 'localhost') + ':' + OPEN_WEBUI_PORT;
            }

            function showOpenWebui() {
                els.openWebuiBtn.href = openWebuiUrl();
                els.openWebuiBtn.hidden = false;
            }

            function hideOpenWebui() {
                els.openWebuiBtn.hidden = true;
            }

            function finishReady() {
                buttonMode = 'delete';
                setStatus('online', 'Ready');
                setButton('Delete Pod', false);
                showOpenWebui();
            }

            function wait(ms) {
                return new Promise(function (resolve) { setTimeout(resolve, ms); });
            }

            function errorDetail(result) {
                if (result.data && typeof result.data.detail === 'string') {
                    return result.data.detail;
                }
                return result.text || ('HTTP ' + result.status);
            }

            function escapeHtml(value) {
                return String(value).replace(/[&<>"']/g, function (char) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
                });
            }

            // Tokenises raw JSON text, then escapes each piece before wrapping it,
            // so response content can never inject markup.
            function highlightJson(text) {
                var pattern = /("(?:\\.|[^"\\])*")(\s*:)?|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|\b(true|false)\b|\bnull\b/g;
                var out = '';
                var last = 0;
                var match;

                while ((match = pattern.exec(text)) !== null) {
                    out += escapeHtml(text.slice(last, match.index));

                    if (match[1] !== undefined) {
                        var cls = match[2] !== undefined ? 'tok-key' : 'tok-str';
                        out += '<span class="' + cls + '">' + escapeHtml(match[1]) + '</span>';
                        if (match[2] !== undefined) {
                            out += escapeHtml(match[2]);
                        }
                    } else if (match[3] !== undefined) {
                        out += '<span class="tok-num">' + escapeHtml(match[3]) + '</span>';
                    } else if (match[4] !== undefined) {
                        out += '<span class="tok-bool">' + escapeHtml(match[4]) + '</span>';
                    } else {
                        out += '<span class="tok-null">null</span>';
                    }

                    last = match.index + match[0].length;
                }

                out += escapeHtml(text.slice(last));
                return out;
            }

            function hidePreview() {
                els.previewWrap.hidden = true;
                els.preview.textContent = '';
            }

            function showPreview(text) {
                var output = text;

                try {
                    output = JSON.stringify(JSON.parse(text), null, 2);
                } catch (err) {
                    /* not JSON — show the raw text */
                }

                els.preview.innerHTML = '<code>' + highlightJson(output) + '</code>';
                els.previewWrap.hidden = false;
            }

            // Builds an Error that carries the response body so the catch block
            // can show it in the preview panel.
            function failure(message, result) {
                var error = new Error(message);
                error.preview = result ? (result.text || message) : message;
                return error;
            }

            // Performs one request and resolves with the parsed body. Resolves for
            // HTTP errors too, so callers can decide whether to retry or stop.
            function request(url, method) {
                var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
                var timeout = controller ? setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT_MS) : null;
                var options = { method: method || 'GET', headers: { 'Accept': 'application/json' } };
                if (controller) {
                    options.signal = controller.signal;
                }

                function clear() {
                    if (timeout) {
                        clearTimeout(timeout);
                    }
                }

                return fetch(url, options)
                    .then(function (response) {
                        return response.text().then(function (text) {
                            var data = null;
                            try {
                                data = text ? JSON.parse(text) : null;
                            } catch (err) {
                                data = null;
                            }
                            return { ok: response.ok, status: response.status, data: data, text: text };
                        });
                    })
                    .then(function (result) {
                        clear();
                        return result;
                    }, function (error) {
                        clear();
                        throw error;
                    });
            }

            /* ---------- state machine ---------- */

            function hasPublicIp(pod) {
                return !!pod && typeof pod.publicIp === 'string' && pod.publicIp !== '';
            }

            // Resolves with the Pod, or null when it does not exist (404).
            function checkPod() {
                return request(POD_URL).then(function (result) {
                    if (result.ok) {
                        return result.data;
                    }
                    if (result.status === 404) {
                        return null;
                    }
                    throw failure('Pod lookup failed: ' + errorDetail(result), result);
                });
            }

            // Waits for the Pod to be assigned a public IP.
            function waitForPublicIp() {
                return request(POD_URL).then(function (result) {
                    var pod = result.data;
                    if (result.ok && hasPublicIp(pod)) {
                        return pod;
                    }
                    return wait(POLL_INTERVAL_MS).then(waitForPublicIp);
                }, function () {
                    return wait(POLL_INTERVAL_MS).then(waitForPublicIp);
                });
            }

            // Opens the SSH tunnel, retrying while the Pod's SSH port mapping settles.
            function openTunnel(attempt) {
                attempt = attempt || 0;
                return request(TUNNEL_URL, 'POST').then(function (result) {
                    if (result.ok) {
                        return result;
                    }
                    if (attempt >= TUNNEL_MAX_ATTEMPTS) {
                        throw failure('SSH tunnel failed: ' + errorDetail(result), result);
                    }
                    return wait(POLL_INTERVAL_MS).then(function () {
                        return openTunnel(attempt + 1);
                    });
                }, function (error) {
                    if (attempt >= TUNNEL_MAX_ATTEMPTS) {
                        throw error;
                    }
                    return wait(POLL_INTERVAL_MS).then(function () {
                        return openTunnel(attempt + 1);
                    });
                });
            }

            // Waits for Ollama to answer through the tunnel.
            function waitForOllama() {
                return request(OLLAMA_URL).then(function (result) {
                    if (result.ok) {
                        return result;
                    }
                    return wait(POLL_INTERVAL_MS).then(waitForOllama);
                }, function () {
                    return wait(POLL_INTERVAL_MS).then(waitForOllama);
                });
            }

            // Drives an existing Pod through the remaining states. The public IP
            // is only awaited when it is not available yet.
            function continueFlow(pod) {
                var deployed;

                if (hasPublicIp(pod)) {
                    deployed = Promise.resolve(pod);
                } else {
                    setStatus('checking', 'Pod Deploying');
                    deployed = waitForPublicIp();
                }

                return deployed
                    .then(function () {
                        setStatus('checking', 'LLM setup');
                        return openTunnel(0);
                    })
                    .then(function () {
                        return waitForOllama();
                    })
                    .then(finishReady);
            }

            // Checks for an existing Pod first. When createIfMissing is false the
            // flow only resumes an existing Pod (used on page load).
            function startFlow(createIfMissing) {
                if (busy) {
                    return;
                }

                var checked = false;

                hidePreview();
                hideOpenWebui();
                setButton('Checking Pod', true);
                setStatus('checking', 'Checking Pod');

                checkPod()
                    .then(function (pod) {
                        checked = true;
                        if (pod) {
                            return continueFlow(pod);
                        }
                        if (!createIfMissing) {
                            buttonMode = 'create';
                            setStatus('idle', 'Idle');
                            setButton('Create Pod', false);
                            return;
                        }

                        setStatus('checking', 'Pod Deploying');
                        setButton('Creating Pod', true);
                        return request(CREATE_POD_URL, 'POST').then(function (result) {
                            if (!result.ok) {
                                throw failure('Pod creation failed: ' + errorDetail(result), result);
                            }
                            return continueFlow(null);
                        });
                    })
                    .catch(function (error) {
                        console.error(error);

                        // A failed existence check on page load should not push the
                        // page into the Failed state; let the user trigger it again.
                        if (!createIfMissing && !checked) {
                            buttonMode = 'create';
                            setStatus('idle', 'Idle');
                            setButton('Create Pod', false);
                            return;
                        }

                        setStatus('offline', 'Failed');
                        showPreview(error.preview || error.message || String(error));
                        buttonMode = 'create';
                        setButton('Create Pod', false);
                    });
            }

            function deletePod() {
                if (busy) {
                    return;
                }

                hidePreview();
                hideOpenWebui();
                setButton('Deleting Pod', true);
                setStatus('checking', 'Deleting Pod');

                request(POD_URL, 'DELETE')
                    .then(function (result) {
                        if (!result.ok) {
                            throw failure('Pod deletion failed: ' + errorDetail(result), result);
                        }
                        buttonMode = 'create';
                        setStatus('idle', 'Idle');
                        setButton('Create Pod', false);
                    })
                    .catch(function (error) {
                        console.error(error);
                        setStatus('offline', 'Failed');
                        showPreview(error.preview || error.message || String(error));

                        // Deletion failed, so the Pod still exists.
                        buttonMode = 'delete';
                        setButton('Delete Pod', false);
                    });
            }

            /* ---------- events ---------- */

            els.createBtn.addEventListener('click', function () {
                if (buttonMode === 'delete') {
                    deletePod();
                    return;
                }
                startFlow(true);
            });

            /* ---------- init ---------- */

            startFlow(false);
        })();
    </script>
</body>
</html>
