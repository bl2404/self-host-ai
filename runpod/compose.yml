services:
  webuiai:
    build:
      context: .
      dockerfile: Dockerfile
    image: webuiai:latest
    container_name: webuiai
    restart: unless-stopped
    network_mode: "service:runpod-api"
    depends_on:
      - runpod-api
      - nginx-proxy
    environment:
      OPENAI_API_BASE_URL: http://127.0.0.1:11435/v1
      OLLAMA_BASE_URL: http://127.0.0.1:11435
      OPENAI_API_KEY: local-key
      WEBUI_NAME: alabama
  simple-website:
    image: nginx:alpine
    container_name: simple-website
    restart: unless-stopped
    depends_on:
      - runpod-api
    ports:
      - "8081:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro,Z
      - ./website-nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z

  nginx-proxy:
    image: nginx:alpine
    container_name: runpod-nginx-proxy
    restart: unless-stopped
    network_mode: "service:runpod-api"
    depends_on:
      - runpod-api
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,Z

  runpod-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: runpod-api:latest
    container_name: runpod-api
    restart: unless-stopped
    ports:
      - "3000:8080"
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:11435:11435"
    environment:
      RUNPOD_API_KEY_FILE: /run/secrets/runpod_api_key
      RUNPOD_SSH_PUBLIC_KEY_FILE: /runpod/id_ed25519.pub
      RUNPOD_SSH_KEY_FILE: /runpod/id_ed25519
    volumes:
      - ./api/config.json:/app/config.json:ro,Z
      - ./api/runpod_api_key.txt:/run/secrets/runpod_api_key:ro,Z
      - ${RUNPOD_SSH_KEY:?Set RUNPOD_SSH_KEY in .env}:/runpod/id_ed25519:ro,Z
      - ${RUNPOD_SSH_KEY:?Set RUNPOD_SSH_KEY in .env}.pub:/runpod/id_ed25519.pub:ro,Z
