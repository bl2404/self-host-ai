[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runpod-api-bridge"
version = "0.1.0"
description = "A minimal FastAPI bridge to the Runpod REST API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "uvicorn[standard]>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
