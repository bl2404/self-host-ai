server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolution is deferred to request time so this
    # container can start (and restart) before runpod-api is resolvable.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same-origin proxy to the FastAPI bridge, so the page never needs CORS
    # and the API can stay bound to loopback.
    location /api/ {
        set $api_upstream http://runpod-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /api {
        return 308 /api/;
    }

    # Ollama readiness check through the SSH tunnel. The nginx-proxy container
    # shares runpod-api's network namespace and listens on 11435.
    location /ollama/ {
        set $ollama_upstream http://runpod-api:11435;
        rewrite ^/ollama/(.*)$ /$1 break;
        proxy_pass $ollama_upstream;

        proxy_http_version 1.1;

        # Ollama rejects Host headers it does not recognise (403), so present
        # an allowlisted host regardless of how the page was reached.
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /ollama {
        return 308 /ollama/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
